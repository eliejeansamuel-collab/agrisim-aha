# Construit l'APK Android et lance les tests à chaque push.
name: APK Android
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  tests-et-apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Modèles d'export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ ! -e ~/.local/share/godot/export_templates/4.4.1.stable ]; then ln -s /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable; fi
      - name: Import et tests du moteur
        run: |
          cd jeu
          godot --headless --import || true
          godot --headless -s tests/run_tests.gd
      - name: Réglages Android (clé de débogage de l'image, SDK, Java)
        run: |
          # Dans GitHub Actions, HOME n'est pas /root : on écrit nous-mêmes les réglages de l'éditeur.
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java : $JAVA_DIR" ; ls -la /root/debug.keystore /usr/lib/android-sdk
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_DIR" > ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
      - name: Export de l'APK
        run: |
          cd jeu && mkdir -p build
          godot --headless --export-debug "Android" build/AgriSimAHA.apk
          ls -la build/AgriSimAHA.apk
          unzip -l build/AgriSimAHA.apk | grep -E "lib/|AndroidManifest|META-INF" || true
      - uses: actions/upload-artifact@v4
        with:
          name: AgriSimAHA-apk
          path: jeu/build/AgriSimAHA.apk
      - name: Publication (lien de téléchargement direct)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dernier-apk
          name: Dernier APK de test
          body: APK de débogage construit automatiquement depuis la branche main. Version de test, non optimisée.
          prerelease: true
          files: jeu/build/AgriSimAHA.apk
